name: Patch AIRFORTH icon tags

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add icon tags to index head
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          block = '''  <link rel="icon" href="./app-icon.png?v=2" type="image/png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=2" />
  <link rel="manifest" href="./manifest.json?v=2" />
  <meta name="theme-color" content="#062b55" />
'''
          if 'apple-touch-icon' not in s:
              s = s.replace('\n  <style>', '\n' + block + '\n  <style>', 1)
              p.write_text(s, encoding='utf-8')
          wf = Path('.github/workflows/patch-airforth-icon-tags.yml')
          if wf.exists():
              wf.unlink()
          PY

      - name: Commit patch and remove workflow
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/patch-airforth-icon-tags.yml
          git commit -m "Add AIRFORTH icon tags to head"
          git push
